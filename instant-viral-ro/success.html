<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comandă Finalizată — InstantViral</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0c10" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lora:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/style-additions.css" />
  <link rel="stylesheet" href="css/success.css" />
  <base target="_blank">
</head>
<body class="success-page">

  <canvas id="confettiCanvas"></canvas>

  <div class="success-wrapper">
    <div class="success-card">
      <div class="success-icon-wrap">
        <svg class="success-checkmark" viewBox="0 0 52 52" width="80" height="80">
          <circle class="success-checkmark-circle" cx="26" cy="26" r="25" fill="none" />
          <path class="success-checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
        </svg>
        <div class="success-pulse-ring"></div>
        <div class="success-pulse-ring delay"></div>
      </div>

      <h1 class="success-title">Mulțumim pentru comandă!</h1>
      <p class="success-subtitle">Comanda ta a fost procesată cu succes. Vei primi confirmarea pe email în câteva minute.</p>

      <div class="success-details">
        <div class="success-detail-row">
          <span class="success-detail-label">Serviciu</span>
          <span class="success-detail-value" id="serviceName">—</span>
        </div>
        <div class="success-detail-row">
          <span class="success-detail-label">Cantitate</span>
          <span class="success-detail-value" id="orderQty">—</span>
        </div>
      </div>

      <div class="success-actions">
        <a href="index.html" class="btn btn-primary btn-glow">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1.5L11.25 6.75H16.5L12.25 9.75L13.75 15L9 12L4.25 15L5.75 9.75L1.5 6.75H6.75L9 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          Înapoi la pagina principală
        </a>
      </div>

      <div class="success-trust">
        <div class="trust-badge">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 8.5l3 3 8-8" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Plată securizată
        </div>
        <div class="trust-badge">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="#22c55e" stroke-width="1.5"/><path d="M8 5v3l2 2" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/></svg>
          Livrare rapidă
        </div>
        <div class="trust-badge">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5l1.6 3.3 3.6.5-2.6 2.5.6 3.6L8 9.7l-3.2 1.7.6-3.6L2.8 5.3l3.6-.5z" stroke="#22c55e" stroke-width="1.5" stroke-linejoin="round"/></svg>
          Garanție 30 zile
        </div>
      </div>
    </div>

    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>
  </div>

  <script src="js/success.js" defer></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
