<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstantViral</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0c10" />


  <meta http-equiv="refresh" content="2;url=index.html?utm_source=qr&utm_medium=bolt_tablet&utm_campaign=bolt_qr" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/style-additions.css" />

  <style>
    .redirect-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
      padding: 2rem;
      background: var(--bg);
    }
    .redirect-spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: redirectSpin 0.8s linear infinite;
    }
    @keyframes redirectSpin {
      to { transform: rotate(360deg); }
    }
    .redirect-text {
      color: var(--text-sub);
      font-size: 0.95rem;
    }
    .redirect-fallback {
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="redirect-wrap">
    <div class="redirect-spinner" aria-hidden="true"></div>
    <p class="redirect-text">Te redirecționăm către InstantViral...</p>
    <a class="redirect-fallback" href="index.html?utm_source=qr&utm_medium=bolt_tablet&utm_campaign=bolt_qr">
      Click aici dacă nu ești redirecționat automat
    </a>
  </div>

  
  <script defer src="/_vercel/insights/script.js"></script>

  <script>

    setTimeout(function () {
      window.location.replace('index.html?utm_source=qr&utm_medium=bolt_tablet&utm_campaign=bolt_qr');
    }, 450);
  </script>

</body>
</html>
